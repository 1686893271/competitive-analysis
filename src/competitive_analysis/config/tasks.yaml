research_task:
  description: >
    对 {company} 在 {industry} 行业进行全面的竞争格局调研。

    请完成以下工作：
    1. 分析 {industry} 行业的整体市场规模、增长趋势和关键驱动因素
    2. 识别 {company} 的主要竞争对手（至少 3-5 家）
    3. 收集每个竞争对手的核心数据：市场份额、融资情况、用户规模、核心产品
    4. 分析行业技术发展趋势和未来方向
    5. 总结 {company} 当前在行业中的竞争地位

    确保信息尽可能准确和最新（当前年份为 2025 年）。
  expected_output: >
    一份结构化的市场调研报告，包含：
    - 行业概览（市场规模、增长率、趋势）
    - 竞争格局图谱（主要玩家及其定位）
    - 各竞品核心数据对比表
    - 行业发展趋势判断
    - {company} 的竞争地位总结
  agent: market_researcher

analysis_task:
  description: >
    基于市场调研结果，对 {company} 及其主要竞品进行深度产品功能对比分析。

    请完成以下工作：
    1. 逐一分析各竞品的核心产品功能列表
    2. 对比各产品的技术架构和实现方案
    3. 分析各产品的目标用户群体和定价策略
    4. 评估各产品的用户体验和口碑
    5. 识别 {company} 的核心竞争优势和需要改进的方向

    请使用结构化的对比表格来呈现分析结果。
  expected_output: >
    一份详细的产品功能对比分析报告，包含：
    - 各竞品核心功能对比矩阵
    - 技术架构对比分析
    - 定价策略对比
    - 用户体验评估
    - {company} 的 SWOT 分析
  agent: product_analyst

report_task:
  description: >
    综合市场调研和产品分析结果，为 {company} 撰写一份完整的竞品分析报告。

    报告需包含以下部分：
    1. 执行摘要（一页纸总结核心发现）
    2. 行业概况与市场格局
    3. 竞品详细对比分析
    4. {company} SWOT 分析
    5. 战略建议（短期、中期、长期）
    6. 附录：数据来源与分析方法说明

    报告要专业、数据充分、建议具体可执行。
  expected_output: >
    一份完整的竞品分析报告，格式为 Markdown，结构清晰、数据详实、
    建议具体可执行。报告应包含表格、对比矩阵和结构化的战略建议。
  agent: strategy_advisor
  output_file: competitive_analysis_report.md
